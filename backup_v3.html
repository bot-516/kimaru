<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キマる — 催促しない日程調整カレンダー</title>
<style>
/* ===================================================================
   キマる — スタイル
   色や角丸を変えたいときは、まずこの :root をいじるのが一番早いです
   =================================================================== */
:root{
  --bg:#f5f6f8;
  --card:#ffffff;
  --line:#e4e7ec;
  --text:#171a1f;
  --muted:#6b7280;
  --accent:#4f46e5;
  --accent-soft:#eef2ff;
  --danger:#dc2626;
  --danger-soft:#fef2f2;
  --ok:#15803d;
  --ok-soft:#f0fdf4;
  --warn:#b45309;
  --warn-soft:#fffbeb;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 80px}

/* ---- 上部の仮想時計バー（デモ用） ---- */
.clockbar{
  background:#171a1f; color:#fff; padding:9px 16px; position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:8px;
}
.clockbar .badge{
  font-size:11px; letter-spacing:.06em; background:#3b3f47; color:#c9cdd4;
  padding:2px 8px; border-radius:999px; white-space:nowrap;
}
.clockbar .now{font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
.clockbar .spacer{flex:1}
.clockbar button{
  font:inherit; font-size:13px; background:#2b2f36; color:#e8eaed; border:1px solid #3f444c;
  padding:5px 10px; border-radius:8px; cursor:pointer; white-space:nowrap;
}
.clockbar button:hover{background:#3a3f47}
.clockbar button.reset{background:transparent; border-color:#4a4f57; color:#9aa0a8}
@media(max-width:560px){
  .clockbar{padding:8px 12px; gap:6px}
  .clockbar .badge{display:none}
  .clockbar .now{font-size:13px}
  .clockbar button{font-size:12px; padding:5px 8px}
}

/* ---- ヘッダー ---- */
header.app{padding:26px 0 16px}
.logo{font-size:26px; font-weight:800; letter-spacing:-.02em}
.logo span{color:var(--accent)}
.tagline{color:var(--muted); font-size:14px; margin-top:2px}

/* ---- タブ ---- */
nav.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto}
nav.tabs button{
  font:inherit; font-size:14px; font-weight:600; background:none; border:none; cursor:pointer;
  padding:10px 13px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px;
  white-space:nowrap;
}
nav.tabs button.active{color:var(--accent); border-bottom-color:var(--accent)}
nav.tabs .dot{
  display:inline-block; min-width:18px; height:18px; line-height:18px; text-align:center;
  background:var(--danger); color:#fff; border-radius:999px; font-size:11px; margin-left:5px; padding:0 5px;
}

/* ---- カード ---- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px}
.card h2{font-size:16px; margin-bottom:4px}
.card .sub{font-size:13px; color:var(--muted); margin-bottom:16px; line-height:1.6}
@media(max-width:560px){ .card{padding:16px} }

/* ===== カレンダー ===== */
.calhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.calhead .m{font-size:17px; font-weight:700}
.calhead button{
  font:inherit; font-size:15px; width:34px; height:34px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--text);
}
.calhead button:hover{background:#f3f4f6}
.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.grid .wd{
  text-align:center; font-size:11px; font-weight:700; color:var(--muted); padding:4px 0;
}
.grid .wd.sun{color:#e11d48} .grid .wd.sat{color:#2563eb}
.cell{
  position:relative; height:58px; border:1px solid var(--line); border-radius:9px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  cursor:default; background:#fff; color:var(--text);
  font:inherit; font-size:13px; padding:0;
}
.cell.blank{background:transparent; border-color:transparent}
.cell.past{color:#c4c8ce; background:#f7f8fa; border-color:transparent}
.cell[disabled]{opacity:1; cursor:default}
@media(max-width:560px){ .cell{height:46px} .grid{gap:3px} }
.cell.today{border-color:var(--text); font-weight:800}
.cell.cand{cursor:pointer; border-color:#c7d2fe}
.cell.cand:hover{border-color:var(--accent)}
.cell.sel{outline:2px solid var(--accent); outline-offset:1px}
.cell.fixed{background:var(--accent)!important; color:#fff; border-color:var(--accent)}
.cell .d{font-weight:600; line-height:1.2}
.cell .yes{font-size:10px; font-weight:700; line-height:1.2}
.cell .ng{position:absolute; top:4px; right:5px; width:6px; height:6px; border-radius:50%; background:var(--danger)}
.cell.addable{cursor:pointer}
.cell.addable:hover{background:var(--accent-soft); border-color:#c7d2fe}
.cell.addable:hover::after{content:'＋'; position:absolute; font-size:16px; color:var(--accent); font-weight:700}
.cell.addable:hover .d,.cell.addable:hover .yes{opacity:0}

.legend{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px; font-size:12px; color:var(--muted)}
.legend .sw{display:inline-block; width:16px; height:16px; border-radius:5px; vertical-align:-3px; margin-right:4px; border:1px solid var(--line)}

/* 選択した候補日の詳細 */
.detail{margin-top:16px; padding:16px; background:#fafbfc; border:1px solid var(--line); border-radius:10px}
.detail h3{font-size:15px; margin-bottom:10px}
.detail .line{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:4px 0; flex-wrap:wrap}
.detail .tag{
  flex:none; width:26px; text-align:center; font-weight:700; border-radius:6px; font-size:13px;
}
.tag.y{background:var(--ok-soft); color:var(--ok)}
.tag.m{background:var(--warn-soft); color:var(--warn)}
.tag.n{background:var(--danger-soft); color:var(--danger)}
.tag.u{background:#eceff3; color:var(--muted)}

/* ---- 締切パネル ---- */
.deadline{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.deadline .big{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.pill{font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px}
.pill.live{background:var(--warn-soft); color:var(--warn)}
.pill.done{background:var(--ok-soft); color:var(--ok)}

/* ---- 回答状況 ---- */
.members{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px}
.chip{
  display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600;
  padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:#fafbfc;
}
.chip.yes{background:var(--ok-soft); border-color:#bbf7d0; color:var(--ok)}
.chip.no{background:var(--danger-soft); border-color:#fecaca; color:var(--danger)}
.progressbar{height:8px; background:#eceff3; border-radius:999px; overflow:hidden; margin:14px 0 6px}
.progressbar i{display:block; height:100%; background:var(--accent); transition:width .35s}

/* ---- テーブル ---- */
.scroller{overflow-x:auto; -webkit-overflow-scrolling:touch}
.scrollhint{font-size:11px; color:var(--muted); text-align:center; margin-top:8px; letter-spacing:.04em}
table{width:100%; border-collapse:collapse; font-size:14px}
th,td{padding:9px 8px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:12px; color:var(--muted); font-weight:600}
td.count{font-variant-numeric:tabular-nums}
tr.win{background:var(--accent-soft)}
tr.win td:first-child{font-weight:700}
.bar{display:inline-block; height:6px; background:var(--accent); border-radius:999px; vertical-align:middle; margin-left:8px}
.crown{color:var(--accent); font-weight:700; font-size:12px; margin-left:6px}
/* マトリクス */
table.matrix th:first-child,table.matrix td:first-child{
  position:sticky; left:0; background:var(--card); font-weight:600; z-index:1;
}
table.matrix td.c{text-align:center; font-weight:700; font-size:14px}
table.matrix td.c.y{color:var(--ok)} table.matrix td.c.m{color:var(--warn)}
table.matrix td.c.n{color:var(--danger)} table.matrix td.c.u{color:#c4c8ce}
table.matrix th.fixcol,table.matrix th.wincol{color:var(--accent)}
table.matrix td.fixcol,table.matrix td.wincol{background:var(--accent-soft)}
table.matrix tfoot td{font-size:13px; font-weight:700; color:var(--muted); border-top:2px solid var(--line); border-bottom:none}
table.matrix tfoot td:first-child{color:var(--muted); font-weight:600}
/* キーボード操作でどこにフォーカスがあるか分かるように */
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
/* 未記入の行を目立たせる（再回答をお願いされた人が、どこを埋めればいいか一目で分かる） */
.answer-row.todo{background:var(--warn-soft); margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:8px}
.answer-row .need{font-size:11px; font-weight:700; color:var(--warn); margin-left:8px}

/* ---- 回答フォーム ---- */
.who{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px}
select,input[type=text],input[type=datetime-local]{
  font:inherit; font-size:14px; padding:8px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--text);
}
.answer-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:11px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.answer-row .label{font-size:14px; font-weight:600}
.answer-row .label small{display:block; font-weight:400; color:var(--muted); font-size:12px}
.opts{display:flex; gap:6px}
.opts button{
  font:inherit; font-size:15px; width:46px; height:38px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:#fff; color:var(--muted);
}
.opts button:hover{border-color:#c3c8d0}
.opts button.on[data-v="yes"]{background:var(--ok); border-color:var(--ok); color:#fff}
.opts button.on[data-v="maybe"]{background:var(--warn); border-color:var(--warn); color:#fff}
.opts button.on[data-v="no"]{background:var(--danger); border-color:var(--danger); color:#fff}

/* ---- ボタン ---- */
.btn{
  font:inherit; font-size:14px; font-weight:600; padding:10px 18px; border-radius:9px;
  border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff; color:var(--accent)}
.btn.small{font-size:13px; padding:7px 13px}
.btn.mini{font-size:12px; padding:5px 10px; border-radius:7px}
.btn.gray{background:#fff; border-color:var(--line); color:var(--muted)}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

/* ---- 通知タイムライン ---- */
.feed{list-style:none}
.feed li{display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:none}
.feed .icon{flex:none; width:32px; height:32px; border-radius:9px; display:grid; place-items:center; font-size:15px; background:var(--accent-soft)}
.feed .icon.remind{background:var(--warn-soft)}
.feed .icon.fix{background:var(--ok-soft)}
.feed .body{flex:1; min-width:0}
.feed .meta{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.feed .msg{font-size:14px; margin-top:1px}
.empty{color:var(--muted); font-size:14px; padding:18px 0; text-align:center; line-height:1.9}

/* ---- 確定結果 ---- */
.result{background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; border:none}
.result h2{color:#fff; font-size:14px; opacity:.85; font-weight:600}
.result .day{font-size:30px; font-weight:800; letter-spacing:-.02em; margin:6px 0 2px; line-height:1.25}
.result .note{font-size:13px; opacity:.9}

/* ---- 催促文コピー ---- */
.copybox{margin-top:14px; padding:14px; background:#fafbfc; border:1px dashed var(--line); border-radius:10px}
.copybox textarea{
  width:100%; font:inherit; font-size:13px; line-height:1.7; border:none; background:transparent;
  resize:vertical; min-height:92px; color:var(--text); outline:none;
}
.copybox .row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; flex-wrap:wrap}
.copybox .hint{font-size:12px; color:var(--muted)}

/* ---- 主催者メニュー ---- */
.setting{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:9px 0; border-bottom:1px solid var(--line)}
.setting label{font-size:13px; color:var(--muted); width:88px; flex:none}
.toast{border-color:#fcd34d!important; background:var(--warn-soft)!important; color:var(--warn)}
.footnote{font-size:12px; color:var(--muted); text-align:center; margin-top:26px; line-height:1.9}
</style>
</head>
<body>

<!-- ===== 上部バー（デモモードでは仮想時計、共有モードでは共有リンク） ===== -->
<div class="clockbar" id="topbar"></div>

<div class="wrap">
  <header class="app">
    <div class="logo">キ<span>マ</span>る</div>
    <div class="tagline">締切が来たら、勝手に決まる日程調整カレンダー</div>
  </header>

  <nav class="tabs">
    <button id="tab-cal"    class="active" onclick="go('cal')">カレンダー</button>
    <button id="tab-board"  onclick="go('board')">集計</button>
    <button id="tab-answer" onclick="go('answer')">回答する</button>
    <button id="tab-feed"   onclick="go('feed')">通知 <span class="dot" id="feedDot" style="display:none">0</span></button>
  </nav>

  <div id="view"></div>

  <p class="footnote" id="footnote"></p>
</div>

<!-- Supabase のライブラリ。npm は使わず、CDNから直接読み込んでいます -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================================================================
   キマる — ロジック本体

   【このアプリの考え方】
   調整さんの弱点は「作った後に何も起きない」こと。
   なので「回答締切」を必ず持たせて、
     ・締切が近づいたら未回答の人に自動で催促を送る
     ・締切が来たら、全員揃っていなくても自動で日程を確定する
   ようにした。幹事が催促しなくてよくなる、というのが売り。

   【時間について】
   締切ベースの機能はデモ会場で実時間を待てないので、
   本物の時計ではなく state.now という「仮想時刻」を使っている。
   上部の「＋1日」などで state.now を進めると tick() が発火して
   催促や自動確定が実際に起きる。
   =================================================================== */

/* ===================================================================
   Supabase の接続情報（設定済み）

   ここが埋まっているので「共有モード」で動きます。
   このURLを人に送れば、全員が同じイベントに回答できます。

   ★この2行を空にすると「デモモード」に戻ります★
     デモモードはネット接続もDBも不要で、仮想時計で時間を早送りできます。
     発表当日にネットやDBが不調だったときの保険として残してあります。

   key は「Publishable key」です。ブラウザに埋め込む前提で作られた公開用の
   キーなので、人に見られても問題ありません。
   逆に「Secret key」は絶対にここへ貼らないこと。あれを貼ると、
   このページを開いた誰もがDBを無制限に操作できるようになります。
   =================================================================== */
const SUPABASE = {
  url: 'https://syswwhswumqcfxdwjoiz.supabase.co',
  key: 'sb_publishable_dENbiD90L6ZEHhkfxK5QIg_vNq72TDW'
};

/* ---- 設定値：ここをいじると挙動が変わります ---- */
const CONFIG = {
  scoreYes: 2,          // ○ の点数
  scoreMaybe: 1,        // △ の点数
  scoreNo: -3,          // × の点数（1人でも×なら避けたいので重めのマイナス）
  remindHours: [24, 4]  // 締切の何時間前に催促を送るか
};

const D = (m, d, h, mi) => new Date(2026, m - 1, d, h, mi || 0); // 日付を書きやすくするヘルパー

/* ---- 初期状態 ---- */
function initialState() {
  return {
    now: D(8, 20, 18),           // 現在の仮想時刻：8/20(木) 18:00
    title: '昼休み集まれる日',
    group: 'JPHacks2026ファン組',
    deadline: D(8, 22, 12),      // 回答締切：8/22(土) 12:00
                                 // ↑「＋1日」を2回押すだけで
                                 //   1回目＝自動催促／2回目＝自動確定 が起きる設定にしてある
    members: ['りくと', 'けんじ', 'ゆうき', 'みなみ', 'そうた'],
    host: 'りくと',
    me: 'けんじ',                 // 「回答する」タブの初期選択者
    slot: '12:15 - 13:00',
    candidates: [
      { id: 'c1', date: D(8, 24, 12, 15) },
      { id: 'c2', date: D(8, 25, 12, 15) },
      { id: 'c3', date: D(8, 26, 12, 15) },
      { id: 'c4', date: D(8, 27, 12, 15) },
      { id: 'c5', date: D(8, 28, 12, 15) }
    ],
    // answers[名前] = { c1:'yes'|'maybe'|'no', ... }
    // キー自体を持っていない人＝未回答
    answers: {
      'りくと': { c1: 'no',    c2: 'yes', c3: 'yes', c4: 'maybe', c5: 'no' },
      'ゆうき': { c1: 'maybe', c2: 'no',  c3: 'yes', c4: 'yes',   c5: 'yes' }
    },
    feed: [],
    sentReminders: [],
    confirmed: null,
    failed: false,               // 全員が参加できる日が無くて決められなかった状態
    // 画面まわり
    view: 'cal',
    calY: 2026, calM: 8,          // カレンダーが表示している年月
    selected: null,               // 選択中の候補日id
    hostMenu: false,              // 主催者メニューを開いているか
    unread: 0,
    dirty: false,                 // 自分の回答を入力中かどうか（同期で消さないための目印）
    seq: 6                        // 新しい候補日のid採番用
  };
}
let state = initialState();

/* ===================================================================
   データ層 —— ここが「みんなで使える」を実現している部分

   モードが2つあります。
     demo   … SUPABASE が空のとき。データはブラウザの中だけ。
              仮想時計で時間を早送りできる（発表用）。
     shared … SUPABASE を設定したとき。データはネット上のDBに入る。
              URLを送れば全員が同じイベントに回答できる。実時間で動く。

   デモモードを残してあるのは保険です。当日ネットやDBが不調でも、
   設定を空に戻せば必ず動くものが手元に残ります。
   =================================================================== */
let mode = 'demo';     // 'demo' か 'shared'
let db = null;         // Supabase のクライアント
let eventId = null;    // いま開いているイベントのID（URLの #e=xxxxx の部分）
let syncing = false;   // 二重に読み込まないための鍵

const newId = () => Math.random().toString(36).slice(2, 8);

/* --- state（画面用）と DBの行 を行き来させる --- */
// 日付は DB では文字列で保存されるので、読み書きのたびに変換が要ります
function toRow() {
  return {
    id: eventId,
    title: state.title, group_name: state.group, host: state.host, slot: state.slot,
    deadline: state.deadline.toISOString(),
    members: state.members,
    candidates: state.candidates.map(c => ({ id: c.id, date: c.date.toISOString() })),
    confirmed: state.confirmed, failed: state.failed,
    feed: state.feed.map(f => ({ at: f.at.toISOString(), type: f.type, msg: f.msg })),
    sent_reminders: state.sentReminders
  };
}
function fromRow(row, answerRows) {
  state.title = row.title; state.group = row.group_name;
  state.host = row.host; state.slot = row.slot || '12:15 - 13:00';
  state.deadline = new Date(row.deadline);
  state.members = row.members || [];
  state.candidates = (row.candidates || []).map(c => ({ id: c.id, date: new Date(c.date) }));
  state.confirmed = row.confirmed; state.failed = !!row.failed;
  state.feed = (row.feed || []).map(f => ({ at: new Date(f.at), type: f.type, msg: f.msg }));
  state.sentReminders = row.sent_reminders || [];

  // 回答は人ごとに別々の行で入っているので、画面用の形に組み直す
  const next = {};
  (answerRows || []).forEach(a => { next[a.member] = a.value || {}; });
  // 自分がいま入力中の分だけは、サーバーの内容で上書きしない（入力が消えるため）
  if (state.dirty && state.answers[state.me]) next[state.me] = state.answers[state.me];
  state.answers = next;

  if (!state.members.includes(state.me)) state.me = state.members[0];
}

/* --- 起動 --- */
async function boot() {
  if (!SUPABASE.url || !SUPABASE.key) { render(); return; }   // 未設定ならデモモード
  try {
    db = window.supabase.createClient(SUPABASE.url, SUPABASE.key);
    mode = 'shared';
    state.now = new Date();
    eventId = new URLSearchParams(location.hash.slice(1)).get('e');
    if (eventId) {
      const ok = await pull();
      if (!ok) { await createEvent(); }   // URLのIDが見つからなければ作り直す
    } else {
      await createEvent();
    }
    setInterval(pull, 3000);             // 3秒ごとに他の人の回答を取りに行く
  } catch (e) {
    console.error(e);
    mode = 'demo'; state = initialState();
    toast('サーバーに繋がらなかったので、デモモードで起動しました。');
  }
  render();
}

/* --- 新しいイベントを1件作る（今日を起点にした候補日で） --- */
async function createEvent() {
  eventId = newId();
  const now = new Date();
  const cands = [];
  let d = new Date(now); d.setDate(d.getDate() + 1);
  while (cands.length < 5) {                       // 土日を飛ばして平日を5日ぶん
    if (d.getDay() !== 0 && d.getDay() !== 6) {
      const x = new Date(d); x.setHours(12, 15, 0, 0);
      cands.push({ id: 'c' + (cands.length + 1), date: x });
    }
    d.setDate(d.getDate() + 1);
  }
  state.candidates = cands;
  state.deadline = new Date(now.getTime() + 48 * 3600000);
  state.answers = {}; state.feed = []; state.sentReminders = [];
  state.confirmed = null; state.failed = false;
  state.calY = cands[0].date.getFullYear();
  state.calM = cands[0].date.getMonth() + 1;
  await db.from('events').insert(toRow());
  location.hash = 'e=' + eventId;
}

/* --- サーバーから最新を取ってくる --- */
async function pull() {
  if (mode !== 'shared' || syncing) return false;
  syncing = true;
  try {
    const { data: ev } = await db.from('events').select('*').eq('id', eventId).maybeSingle();
    if (!ev) return false;
    const { data: ans } = await db.from('answers').select('*').eq('event_id', eventId);
    fromRow(ev, ans);
    state.now = new Date();

    // 締切チェックはサーバーの常駐プログラムではなく、
    // 「誰かが画面を開いたとき」に走らせています。
    // 常駐サーバーを立てずに自動確定を成立させるための割り切りです。
    const before = JSON.stringify([state.confirmed, state.failed, state.feed.length, state.sentReminders.length]);
    tick();
    if (JSON.stringify([state.confirmed, state.failed, state.feed.length, state.sentReminders.length]) !== before) {
      await persist();
    }
    render();
    return true;
  } catch (e) { console.error(e); return false; }
  finally { syncing = false; }
}

/* --- イベントの内容をサーバーに書き戻す --- */
async function persist() {
  if (mode !== 'shared') return;
  try { await db.from('events').update(toRow()).eq('id', eventId); }
  catch (e) { console.error(e); toast('保存に失敗しました。通信を確認してください。'); }
}

/* --- 自分の回答だけをサーバーに保存する --- */
async function saveAnswer() {
  if (mode !== 'shared') return;
  try {
    await db.from('answers').upsert({
      event_id: eventId, member: state.me,
      value: state.answers[state.me] || {}, updated_at: new Date().toISOString()
    });
  } catch (e) { console.error(e); toast('回答の保存に失敗しました。'); }
}

/* --- 共有リンクをコピー --- */
function copyLink() {
  const url = location.href;
  const ta = document.createElement('textarea');
  ta.value = url; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  try { navigator.clipboard.writeText(url); } catch (e) {}
  ta.remove();
  toast('共有リンクをコピーしました。この URL を送れば、全員が同じイベントに回答できます。');
}

/* ================= 便利関数 ================= */
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const pad = n => String(n).padStart(2, '0');
const fmt  = d => `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtD = d => `${d.getMonth() + 1}/${d.getDate()} (${WD[d.getDay()]})`;
const esc  = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

// 「回答済み」＝すべての候補日に ○△× のどれかを入れている人。
// 候補日が後から追加されたら、その人は自動的に「未回答」に戻る（＝また催促の対象になる）。
function hasAnswered(m) {
  const a = state.answers[m];
  return !!a && state.candidates.every(c => a[c.id]);
}
function unanswered() { return state.members.filter(m => !hasAnswered(m)); }
function answered()   { return state.members.filter(m =>  hasAnswered(m)); }
function candById(id) { return state.candidates.find(c => c.id === id); }
function sortedCands(){ return [...state.candidates].sort((a, b) => a.date - b.date); }

// 候補日の集計
function scoreOf(cid) {
  let s = 0, yes = 0, maybe = 0, no = 0;
  for (const m of state.members) {       // 途中まで答えている人の分もちゃんと数える
    if (!state.answers[m]) continue;
    const v = state.answers[m][cid];
    if (v === 'yes')   { s += CONFIG.scoreYes;   yes++; }
    if (v === 'maybe') { s += CONFIG.scoreMaybe; maybe++; }
    if (v === 'no')    { s += CONFIG.scoreNo;    no++; }
  }
  return { score: s, yes, maybe, no };
}
// いま一番有力な候補（同点なら日付が早い方）
function leader() {
  let best = null;
  for (const c of sortedCands()) {
    const r = scoreOf(c.id);
    if (!best || r.score > best.score) best = { ...r, cand: c };
  }
  return best;
}
function push(type, msg) {
  state.feed.unshift({ at: new Date(state.now), type, msg });
  state.unread++;
}

/* ================= 自動処理エンジン =================
   時刻が進むたびに呼ばれ、「今やるべきこと」を実行する。
   ここがこのアプリの心臓部。 */
function tick() {
  if (state.confirmed || state.failed) return;
  if (state.candidates.length === 0 || state.members.length === 0) return;

  // (1) 全員が回答し終わったら、締切を待たずに即確定
  if (unanswered().length === 0) {
    finalize('全員の回答が揃ったため、締切を待たずに確定しました。');
    return;
  }
  // (2) 締切が来たら、揃っていなくても確定する ← これが一番の売り
  if (state.now >= state.deadline) {
    const miss = unanswered();
    if (finalize(`締切のため自動確定しました。${state.members.length}人中${answered().length}人の回答で決定しています。`)) {
      miss.forEach(m => push('remind',
        `<b>${esc(m)}</b> さんへ：回答がないまま日程が確定しました。次回は締切までにお願いします。`));
    }
    return;
  }
  // (3) 締切の N 時間前になったら、未回答の人だけに催促を送る
  for (const h of CONFIG.remindHours) {
    const at = new Date(state.deadline.getTime() - h * 3600000);
    if (state.now >= at && !state.sentReminders.includes(h)) {
      state.sentReminders.push(h);
      const t = unanswered();
      if (t.length) push('remind',
        `【${h >= 24 ? '自動リマインド' : 'ラストコール'}】締切まであと${h}時間。未回答の <b>${esc(t.join('・'))}</b> に自動で通知を送りました。`);
    }
  }
}
// 確定できたら true、決められなかったら false を返す
function finalize(reason) {
  const win = leader();
  // ○も△も1人もいない日しか残っていないなら、無理に確定させない。
  // （全員が×の日に勝手に決められたら、それはツールとして最悪なので）
  if (win.yes + win.maybe === 0) {
    state.failed = true;
    push('remind', '全員が参加できる日がありませんでした。候補日を追加して再調整してください。');
    return false;
  }
  state.confirmed = win.cand.id;
  state.calY = win.cand.date.getFullYear();
  state.calM = win.cand.date.getMonth() + 1;
  push('fix', `日程が <b>${fmtD(win.cand.date)}</b> に確定しました。${reason}`);
  return true;
}

/* 確定・決裂のあとに、締切を延ばしてもう一度調整をやり直す */
function reopen() {
  state.confirmed = null;
  state.failed = false;
  state.deadline = new Date(state.now.getTime() + 24 * 3600000);
  state.sentReminders = [];
  state.selected = null;
  push('remind', `主催者が再調整を開始しました。新しい締切は <b>${fmt(state.deadline)}</b> です。`);
  persist();
  render();
}

/* ================= 操作 ================= */
function advance(hours) {
  if (mode !== 'demo') return;      // 共有モードは実時間で動くので早送りしない
  for (let i = 0; i < hours; i++) {   // 1時間ずつ進めて途中の催促を取りこぼさない
    state.now = new Date(state.now.getTime() + 3600000);
    tick();
  }
  render();
}
function resetAll() {
  if (mode !== 'demo') return toast('共有モードでは初期化できません。新しいイベントを作ってください。');
  state = initialState(); render();
}
function go(v) { state.view = v; if (v === 'feed') state.unread = 0; render(); }
function shiftMonth(d) {
  let m = state.calM + d, y = state.calY;
  if (m > 12) { m = 1; y++; } if (m < 1) { m = 12; y--; }
  state.calM = m; state.calY = y; render();
}
function selectCand(id) { state.selected = state.selected === id ? null : id; render(); }
function toggleHostMenu() { state.hostMenu = !state.hostMenu; render(); }

// カレンダーの空き日をクリック → 候補日に追加
function addCandidate(y, m, d) {
  if (state.confirmed) return toast('確定後は「再調整する」を押してから候補日を変更してください。');
  const [hh, mm] = state.slot.split('-')[0].trim().split(':').map(Number);
  const id = 'c' + (state.seq++);
  const date = new Date(y, m - 1, d, hh, mm);
  const before = answered();                     // 追加する前に回答が完了していた人
  state.candidates.push({ id, date });
  const reopened = before.filter(x => !hasAnswered(x));
  if (reopened.length) {                         // 新しい候補日の分だけ、また未回答に戻る
    state.sentReminders = [];
    push('remind', `候補日 <b>${fmtD(date)}</b> が追加されたため、<b>${esc(reopened.join('・'))}</b> に再回答のお願いを送りました。`);
  }
  state.selected = id;
  persist();
  render();
}
function removeCandidate(id) {
  if (state.confirmed) return;
  state.candidates = state.candidates.filter(c => c.id !== id);
  for (const m in state.answers) delete state.answers[m][id];
  if (state.selected === id) state.selected = null;
  persist();
  render();
}
function setAnswer(cid, val) {
  if (!state.answers[state.me]) state.answers[state.me] = {};
  state.answers[state.me][cid] = val;
  state.dirty = true;
  render();
}
function fillAll(val) {
  if (!state.answers[state.me]) state.answers[state.me] = {};
  state.candidates.forEach(c => state.answers[state.me][c.id] = val);
  state.dirty = true;
  render();
}
async function submitAnswer() {
  const me = state.me, a = state.answers[me] || {};
  const missing = state.candidates.filter(c => !a[c.id]);
  if (missing.length) return toast(`${missing.length}件、まだ ○ △ × が入っていません。`);
  state.dirty = false;
  await saveAnswer();                 // 先に自分の回答を保存してから
  push('answer', `<b>${esc(me)}</b> さんが回答しました。（残り未回答：${unanswered().length}人）`);
  tick();
  await persist();                    // 通知や確定の結果を書き戻す
  go('board');
}
function changeMe(v) { state.me = v; render(); }

/* 確定した日を .ics で書き出して、普段のカレンダーアプリに取り込めるようにする */
function downloadIcs() {
  const c = candById(state.confirmed);
  if (!c) return;
  const [sH, sM] = state.slot.split('-')[0].trim().split(':').map(Number);
  const [eH, eM] = state.slot.split('-')[1].trim().split(':').map(Number);
  const stamp = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const s = new Date(c.date); s.setHours(sH, sM, 0, 0);
  const e = new Date(c.date); e.setHours(eH, eM, 0, 0);
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//kimaru//JP', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:kimaru-${c.id}-${Date.now()}@local`,
    `DTSTAMP:${stamp(new Date())}`,
    `DTSTART:${stamp(s)}`,
    `DTEND:${stamp(e)}`,
    `SUMMARY:${state.title}`,
    `DESCRIPTION:${state.group} / キマるで自動確定 (${answered().length}/${state.members.length}人の回答)`,
    'END:VEVENT', 'END:VCALENDAR'
  ].join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'kimaru.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('カレンダーファイル（.ics）を書き出しました。開くとカレンダーアプリに登録できます。');
}
function setTitle(v) { state.title = v; }
function setDeadline(v) {
  if (!v) return;
  state.deadline = new Date(v);
  state.sentReminders = [];   // 締切を変えたら催促は送り直し
  persist();
  render();
}
function addMember() {
  const el = document.getElementById('newMember');
  const n = (el.value || '').trim();
  if (!n) return;
  if (state.members.includes(n)) return toast('同じ名前の人がすでにいます。');
  state.members.push(n); el.value = '';
  persist();
  render();
}
function removeMember(n) {
  state.members = state.members.filter(m => m !== n);
  delete state.answers[n];
  if (state.me === n) state.me = state.members[0];
  persist();
  render();
}

// 画面内メッセージ（alert() はデモ中に画面が固まるので使わない）
let notice = '';
function toast(msg) { notice = msg; render(); clearTimeout(toast._t); toast._t = setTimeout(() => { notice = ''; render(); }, 2800); }

function copyText() {
  const ta = document.getElementById('copyArea');
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  try { navigator.clipboard.writeText(ta.value); } catch (e) {}
  const b = document.getElementById('copyBtn');
  b.textContent = 'コピーしました'; setTimeout(() => { b.textContent = 'コピー'; }, 1600);
}

/* ================= 描画 ================= */
function render() {
  renderTopbar();
  const dot = document.getElementById('feedDot');
  dot.style.display = state.unread > 0 ? 'inline-block' : 'none';
  dot.textContent = state.unread;
  ['cal', 'board', 'answer', 'feed'].forEach(v =>
    document.getElementById('tab-' + v).classList.toggle('active', state.view === v));

  let html = notice ? `<div class="card toast">${esc(notice)}</div>` : '';
  if (state.view === 'cal')    html += viewCalendar();
  if (state.view === 'board')  html += viewBoard();
  if (state.view === 'answer') html += viewAnswer();
  if (state.view === 'feed')   html += viewFeed();
  document.getElementById('view').innerHTML = html;

  // 横にはみ出している表には「スクロールできる」ヒントを出す（スマホで表が切れて見えるため）
  document.querySelectorAll('.scroller').forEach(el => {
    if (el.scrollWidth > el.clientWidth + 2) {
      const hint = document.createElement('div');
      hint.className = 'scrollhint';
      hint.textContent = '← 横にスクロールできます →';
      el.after(hint);
    }
  });
}

/* 上部バー：モードによって中身が変わる */
function renderTopbar() {
  const bar = document.getElementById('topbar');
  if (mode === 'shared') {
    bar.innerHTML = `
      <span class="badge">共有モード</span>
      <span class="now">${fmt(state.now)}</span>
      <span class="spacer"></span>
      <button onclick="copyLink()">共有リンクをコピー</button>`;
  } else {
    bar.innerHTML = `
      <span class="badge">デモ用 仮想時計</span>
      <span class="now">${fmt(state.now)}</span>
      <span class="spacer"></span>
      <button onclick="advance(1)">＋1h</button>
      <button onclick="advance(6)">＋6h</button>
      <button onclick="advance(24)">＋1日</button>
      <button class="reset" onclick="resetAll()" title="最初からやり直す" aria-label="最初からやり直す">↺</button>`;
  }
  document.getElementById('footnote').innerHTML = mode === 'shared'
    ? `キマる — このページのURLを送れば、全員が同じイベントに回答できます。<br>
       回答は3秒ごとに自動で同期されます。`
    : `キマる — JPHACKS2026 個人開発課題プロトタイプ<br>
       ※ デモモードです。データはブラウザのメモリ上のみで、再読み込みで初期状態に戻ります。`;
}

/* 確定結果（または決裂）のバナー。カレンダーと集計の両方で使う */
function resultBanner() {
  if (state.failed) {
    return `<div class="card" style="border-color:#fecaca;background:var(--danger-soft)">
      <h2 style="color:var(--danger)">日程が決まりませんでした</h2>
      <div class="sub" style="margin-bottom:12px">全員が参加できる日が候補の中にありませんでした。
        カレンダーで候補日を足してから、再調整してください。</div>
      <button class="btn small" onclick="reopen()">再調整する（締切を24時間延長）</button>
    </div>`;
  }
  if (!state.confirmed) return '';
  const c = candById(state.confirmed), r = scoreOf(c.id);
  return `<div class="card result">
    <h2>確定しました</h2>
    <div class="day">${fmtD(c.date)} ${esc(state.slot)}</div>
    <div class="note">○ ${r.yes}人 ／ △ ${r.maybe}人 ／ × ${r.no}人 ・ ${answered().length}/${state.members.length}人の回答で決定</div>
    <div class="btnrow" style="margin-top:14px">
      <button class="btn small ghost" onclick="downloadIcs()">カレンダーに追加（.ics）</button>
      <button class="btn small ghost" onclick="reopen()">再調整する</button>
    </div>
  </div>`;
}

/* ---- ① カレンダー ---- */
function viewCalendar() {
  const y = state.calY, m = state.calM;
  const first = new Date(y, m - 1, 1);
  const days = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const total = state.members.length;

  let h = resultBanner() + `<div class="card">
    <div class="calhead">
      <button onclick="shiftMonth(-1)" aria-label="前の月">‹</button>
      <div class="m">${y}年 ${m}月</div>
      <button onclick="shiftMonth(1)" aria-label="次の月">›</button>
    </div>
    <div class="grid">
      ${WD.map((w, i) => `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('')}`;

  for (let i = 0; i < lead; i++) h += `<div class="cell blank"></div>`;

  for (let d = 1; d <= days; d++) {
    const date = new Date(y, m - 1, d, 23, 59);
    const cand = state.candidates.find(c => sameDay(c.date, date));
    const isToday = sameDay(state.now, date);
    const past = date < state.now && !isToday;
    const cls = ['cell'];
    let style = '', inner = `<span class="d">${d}</span>`, click = '', label = '';

    if (cand) {
      const r = scoreOf(cand.id);
      const ratio = total ? r.yes / total : 0;
      const fixed = state.confirmed === cand.id;
      cls.push('cand');
      if (fixed) cls.push('fixed');
      else style = `background:rgba(79,70,229,${(0.10 + ratio * 0.62).toFixed(2)});`;
      if (state.selected === cand.id) cls.push('sel');
      inner += fixed ? `<span class="yes">確定</span>` : `<span class="yes">○${r.yes}</span>`;
      if (r.no > 0 && !fixed) inner += `<span class="ng"></span>`;
      click = `onclick="selectCand('${cand.id}')"`;
      label = `aria-label="${d}日 候補日 ○${r.yes}人"`;
    } else if (past) {
      cls.push('past');
    } else if (!state.confirmed) {
      cls.push('addable');
      click = `onclick="addCandidate(${y},${m},${d})"`;
      label = `aria-label="${d}日を候補日に追加"`;
    }
    if (isToday) cls.push('today');
    // 押しても何も起きないセルは disabled にして、キーボード操作の邪魔にならないようにする
    const dis = click ? '' : 'disabled';
    h += `<button class="${cls.join(' ')}" style="${style}" ${click} ${label} ${dis}>${inner}</button>`;
  }
  h += `</div>
    <div class="legend">
      <span><i class="sw" style="background:rgba(79,70,229,.72)"></i>○が多い日</span>
      <span><i class="sw" style="background:rgba(79,70,229,.12)"></i>○が少ない日</span>
      <span><i class="sw" style="background:#fff;position:relative"><i style="display:block;width:6px;height:6px;border-radius:50%;background:var(--danger);margin:2px auto 0"></i></i>×の人がいる</span>
      <span>${state.confirmed ? '確定済み' : '空いている日をクリックで候補日に追加'}</span>
    </div>`;

  // 表示していない月にも候補日があるなら、見落とさないように出しておく
  const others = state.candidates.filter(c => c.date.getFullYear() !== y || c.date.getMonth() + 1 !== m);
  if (others.length) {
    const groups = {};
    others.forEach(c => {
      const k = `${c.date.getFullYear()}-${c.date.getMonth() + 1}`;
      groups[k] = (groups[k] || 0) + 1;
    });
    h += `<div class="btnrow" style="margin-top:12px;font-size:13px;color:var(--muted)">
      <span>他の月の候補日：</span>
      ${Object.entries(groups).sort().map(([k, n]) => {
        const [gy, gm] = k.split('-');
        return `<button class="btn mini gray" onclick="state.calY=${gy};state.calM=${gm};render()">${gy}年${gm}月に${n}日</button>`;
      }).join('')}
    </div>`;
  }

  // 選択中の候補日の詳細（誰が○で誰が×か）
  if (state.selected && candById(state.selected)) {
    const c = candById(state.selected), r = scoreOf(c.id);
    const by = v => state.members.filter(m => state.answers[m] && state.answers[m][c.id] === v);
    const none = state.members.filter(m => !state.answers[m] || !state.answers[m][c.id]);
    const row = (cls, mark, list) => list.length
      ? `<div class="line"><span class="tag ${cls}">${mark}</span><span>${esc(list.join('、'))}</span></div>` : '';
    h += `<div class="detail">
      <h3>${fmtD(c.date)} ${esc(state.slot)}${state.confirmed === c.id ? '　<span class="crown">確定</span>' : ''}</h3>
      ${row('y', '○', by('yes'))}${row('m', '△', by('maybe'))}${row('n', '×', by('no'))}${row('u', '−', none)}
      <div class="btnrow" style="margin-top:12px">
        <span style="font-size:13px;color:var(--muted)">スコア ${r.score}点</span>
        ${state.confirmed ? '' : `<button class="btn mini gray" onclick="removeCandidate('${c.id}')">候補から外す</button>`}
      </div>
    </div>`;
  }
  h += `</div>`;

  // 主催者メニュー（イベントの中身を作り変えられる）
  h += `<div class="card">
    <div class="btnrow" style="justify-content:space-between">
      <div>
        <h2>${esc(state.title)}</h2>
        <div class="sub" style="margin:0">${esc(state.group)} ・ 候補${state.candidates.length}日 ・ ${state.members.length}人<br>
          ${state.confirmed ? '確定済み'
            : state.failed ? '締切超過・未確定'
            : `締切 ${fmt(state.deadline)}（あと${Math.max(0, Math.round((state.deadline - state.now) / 3600000))}時間）・ 未回答 ${unanswered().length}人`}</div>
      </div>
      <button class="btn small ghost" onclick="toggleHostMenu()">${state.hostMenu ? '閉じる' : '主催者メニュー'}</button>
    </div>`;
  if (state.hostMenu) {
    const dl = state.deadline;
    const v = `${dl.getFullYear()}-${pad(dl.getMonth() + 1)}-${pad(dl.getDate())}T${pad(dl.getHours())}:${pad(dl.getMinutes())}`;
    h += `<div style="margin-top:14px">
      <div class="setting"><label>イベント名</label>
        <input type="text" value="${esc(state.title)}" oninput="setTitle(this.value)" onchange="persist();render()" style="flex:1;min-width:180px"></div>
      <div class="setting"><label>回答締切</label>
        <input type="datetime-local" value="${v}" onchange="setDeadline(this.value)"></div>
      <div class="setting" style="align-items:flex-start"><label>メンバー</label>
        <div style="flex:1;min-width:200px">
          <div class="members" style="margin:0 0 8px">
            ${state.members.map(m => `<span class="chip">${esc(m)}
              <button class="btn mini gray" style="padding:1px 6px" onclick="removeMember('${esc(m)}')" aria-label="${esc(m)}を削除">×</button></span>`).join('')}
          </div>
          <div class="btnrow">
            <input type="text" id="newMember" placeholder="名前を入力" style="flex:1;min-width:130px"
                   onkeydown="if(event.key==='Enter')addMember()">
            <button class="btn small" onclick="addMember()">追加</button>
          </div>
        </div></div>
      <div class="sub" style="margin:12px 0 0">候補日はカレンダーの空いている日をクリックで追加、候補日をクリック→「候補から外す」で削除できます。</div>
    </div>`;
  }
  h += `</div>`;
  return h;
}

/* ---- ② 集計 ---- */
function viewBoard() {
  const miss = unanswered(), done = answered();
  const hoursLeft = Math.max(0, Math.round((state.deadline - state.now) / 3600000));
  const pct = Math.round(done.length / Math.max(1, state.members.length) * 100);
  let h = resultBanner();

  h += `<div class="card">
    <h2>${esc(state.title)}</h2>
    <div class="sub">${esc(state.group)} ・ 主催 ${esc(state.host)}</div>
    <div class="deadline">
      <div><div style="font-size:12px;color:var(--muted)">回答締切</div>
        <div class="big">${fmt(state.deadline)}</div></div>
      ${state.confirmed ? `<span class="pill done">確定済み</span>`
        : state.failed ? `<span class="pill" style="background:var(--danger-soft);color:var(--danger)">締切超過・未確定</span>`
        : `<span class="pill live">あと ${hoursLeft} 時間</span>`}
    </div>
    ${state.confirmed || state.failed ? '' : `<div style="margin-top:12px;font-size:13px;color:var(--muted)">
      締切を過ぎると、回答が揃っていなくても最有力の日で自動的に確定します。</div>`}
  </div>`;

  h += `<div class="card">
    <h2>回答状況</h2>
    <div class="sub">${state.members.length}人中 ${done.length}人が回答済み</div>
    <div class="progressbar"><i style="width:${pct}%"></i></div>
    <div class="members">
      ${done.map(m => `<span class="chip yes">✓ ${esc(m)}</span>`).join('')}
      ${miss.map(m => `<span class="chip no">! ${esc(m)}</span>`).join('')}
    </div>`;
  if (miss.length && !state.confirmed) {
    const txt =
`【${state.title}】まだ ${miss.join('・')} の回答が入ってません！
締切は ${fmt(state.deadline)} です。
締切を過ぎると自動で日程が決まってしまうので、それまでにお願いします🙏`;
    h += `<div class="copybox">
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">LINEに貼れる催促文（自動生成）</div>
      <textarea id="copyArea" readonly aria-label="催促文">${esc(txt)}</textarea>
      <div class="row"><span class="hint">未回答の人の名前が自動で入ります</span>
        <button class="btn small" id="copyBtn" onclick="copyText()">コピー</button></div>
    </div>`;
  }
  h += `</div>`;

  const cands = sortedCands();
  if (!cands.length) return h + `<div class="card"><div class="empty">候補日がありません。<br>カレンダータブで日付をクリックして追加してください。</div></div>`;

  // 誰がどの日に何を出したか＋集計を1枚にまとめた表（調整さんの本体にあたる部分）
  const sym = { yes: ['○', 'y'], maybe: ['△', 'm'], no: ['×', 'n'] };
  const best = leader();
  const winId = state.confirmed || (state.failed ? null : best && best.cand.id);
  const colCls = c => c.id === winId ? (state.confirmed ? 'fixcol' : 'wincol') : '';

  h += `<div class="card">
    <h2>みんなの回答</h2>
    <div class="sub">「−」は未回答。○＝${CONFIG.scoreYes}点 ／ △＝${CONFIG.scoreMaybe}点 ／ ×＝${CONFIG.scoreNo}点 で自動採点します。
      ×を重いマイナスにしてあるのは「1人でも無理な日は避けたい」から。</div>
    <div class="scroller"><table class="matrix"><thead><tr><th>メンバー</th>
      ${cands.map(c => `<th class="${colCls(c)}">${fmtD(c.date)}${
        c.id === winId ? `<br><span class="crown">${state.confirmed ? '確定' : '最有力'}</span>` : ''}</th>`).join('')}
    </tr></thead><tbody>
      ${state.members.map(m => `<tr><td>${esc(m)}</td>${cands.map(c => {
        const v = state.answers[m] && state.answers[m][c.id];
        const [s, k] = sym[v] || ['−', 'u'];
        return `<td class="c ${k} ${colCls(c)}">${s}</td>`;
      }).join('')}</tr>`).join('')}
    </tbody>
    <tfoot>
      <tr><td>○の人数</td>${cands.map(c => `<td class="c ${colCls(c)}">${scoreOf(c.id).yes}</td>`).join('')}</tr>
      <tr><td>スコア</td>${cands.map(c => {
        const s = scoreOf(c.id).score;
        return `<td class="c ${colCls(c)}" style="color:${s > 0 ? 'var(--accent)' : 'var(--muted)'}">${s}</td>`;
      }).join('')}</tr>
    </tfoot></table></div>
  </div>`;
  return h;
}

/* ---- ③ 回答する ---- */
function viewAnswer() {
  if (state.confirmed) {
    const c = candById(state.confirmed);
    return `<div class="card"><h2>回答は締め切られました</h2>
      <div class="sub" style="margin:0">この日程は <b>${fmtD(c.date)} ${esc(state.slot)}</b> に確定しています。</div></div>`;
  }
  const cands = sortedCands();
  if (!cands.length) return `<div class="card"><div class="empty">候補日がありません。<br>カレンダータブで日付をクリックして追加してください。</div></div>`;
  if (!state.members.length) return `<div class="card"><div class="empty">メンバーがいません。<br>カレンダータブの「主催者メニュー」から追加してください。</div></div>`;

  const me = state.me, mine = state.answers[me] || {};
  let h = `<div class="card">
    <h2>${esc(state.title)}</h2>
    <div class="sub">締切 ${fmt(state.deadline)} まで</div>
    <div class="who">
      <span style="font-size:13px;color:var(--muted)">回答する人</span>
      <select onchange="changeMe(this.value)" aria-label="回答する人">
        ${state.members.map(m => `<option ${m === me ? 'selected' : ''}>${esc(m)}</option>`).join('')}
      </select>
      <span style="font-size:12px;color:var(--muted)">${hasAnswered(me) ? '（回答済み・上書きできます）' : '（未回答）'}</span>
    </div>
    <div class="btnrow" style="margin-bottom:6px">
      <span style="font-size:12px;color:var(--muted)">まとめて入力：</span>
      <button class="btn mini gray" onclick="fillAll('yes')">全部 ○</button>
      <button class="btn mini gray" onclick="fillAll('maybe')">全部 △</button>
      <button class="btn mini gray" onclick="fillAll('no')">全部 ×</button>
    </div>`;
  const todo = cands.filter(c => !mine[c.id]).length;
  if (todo && todo < cands.length) {
    h += `<div class="sub" style="margin:10px 0 0;color:var(--warn);font-weight:600">
      候補日が追加されました。未記入の ${todo} 件を埋めてください。</div>`;
  }
  for (const c of cands) {
    const v = mine[c.id];
    h += `<div class="answer-row ${!v && todo < cands.length ? 'todo' : ''}">
      <div class="label">${fmtD(c.date)}${!v && todo < cands.length ? '<span class="need">未記入</span>' : ''}<small>${esc(state.slot)}</small></div>
      <div class="opts">
        <button data-v="yes"   class="${v === 'yes' ? 'on' : ''}"   aria-label="${fmtD(c.date)} 参加できる"   onclick="setAnswer('${c.id}','yes')">○</button>
        <button data-v="maybe" class="${v === 'maybe' ? 'on' : ''}" aria-label="${fmtD(c.date)} たぶん行ける" onclick="setAnswer('${c.id}','maybe')">△</button>
        <button data-v="no"    class="${v === 'no' ? 'on' : ''}"    aria-label="${fmtD(c.date)} 参加できない" onclick="setAnswer('${c.id}','no')">×</button>
      </div></div>`;
  }
  return h + `<div style="margin-top:18px"><button class="btn" onclick="submitAnswer()">この内容で回答する</button></div></div>`;
}

/* ---- ④ 通知 ---- */
function viewFeed() {
  if (!state.feed.length) {
    return `<div class="card"><div class="empty">
      まだ通知はありません。<br>上部の「＋1日」で時間を進めると、自動で催促が飛びます。</div></div>`;
  }
  const icons = { remind: '🔔', fix: '✅', answer: '✍️' };
  return `<div class="card"><h2>通知</h2>
    <div class="sub">幹事が手を動かさなくても、ここに自動で記録されていきます</div>
    <ul class="feed">${state.feed.map(f => `<li>
      <div class="icon ${f.type}">${icons[f.type] || '•'}</div>
      <div class="body"><div class="meta">${fmt(f.at)}</div><div class="msg">${f.msg}</div></div>
    </li>`).join('')}</ul></div>`;
}

boot();
</script>
</body>
</html>
