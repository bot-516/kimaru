/* ---- グループの中身 ---- */
function viewGroup() {
  const live = state.gevents.filter(e=>!e.confirmed && !e.failed);
  const done = state.gevents.filter(e=>e.confirmed || e.failed);
  let h=`<div class="gtop">
    <div class="gn">${esc(state.gname||'（名前なし）')}</div>
    <div class="gm">${state.gmembers.length}人　調整${state.gevents.length}件</div>
  </div>`;

  // 誰として見ているか。ここが決まらないと回答も催促も始まらない
  h+=`<section><div class="slabel">あなたは誰ですか</div>`;
  if (state.gmembers.length) {
    h+=`<div class="people">${state.gmembers.map((m,i)=>
      `<button class="who pickable ${m===state.me?'iam':''}" onclick="pickMe(${i})">${esc(m)}</button>`).join('')}</div>`;
  }
  // 名前が決まっていない人には、選ぶ手段と足す手段を同時に出す。
  // 「名前がない人はこちら」を挟むと、初めての人が一手余分に踏む。
  if (!state.me || state.joining) {
    h+=`<div class="brow" style="margin-top:${state.gmembers.length?'12':'0'}px">
      <input type="text" id="gJoin" maxlength="20" placeholder="名前を入力" style="flex:1;min-width:140px"
        onkeydown="if(event.key==='Enter')joinGroup()">
      <button class="b" onclick="joinGroup()">参加する</button>
      ${state.me?`<button class="b sm quiet" onclick="state.joining=false;render()">やめる</button>`:''}</div>`;

  } else {
    h+=`<p class="note tight"><button class="b sm quiet" onclick="state.joining=true;render()">別の人を追加する</button></p>`;
  }
  h+=`</section>`;

  // カレンダー：いま何が入っているかを、まず見せる
  const y=state.calY, m=state.calM;
  const fixedOn={}, candOn={};
  state.gevents.forEach(e=>{
    if (e.confirmed) { const c=e.candidates.find(x=>x.id===e.confirmed);
      if (c) fixedOn[`${c.date.getFullYear()}-${c.date.getMonth()+1}-${c.date.getDate()}`]={t:e.title,id:e.id}; }
    else if (!e.failed) e.candidates.forEach(c=>{
      const k=`${c.date.getFullYear()}-${c.date.getMonth()+1}-${c.date.getDate()}`; candOn[k]=(candOn[k]||0)+1; });
  });
  const today=new Date(); today.setHours(0,0,0,0);
  const days=new Date(y,m,0).getDate(), lead0=new Date(y,m-1,1).getDay();
  const cells=[];
  for (let i=0;i<lead0;i++) cells.push(null);
  for (let d=1;d<=days;d++) cells.push(d);
  while (cells.length%7) cells.push(null);
  const weeks=[];
  for (let i=0;i<cells.length;i+=7) {
    const w=cells.slice(i,i+7);
    const alive=w.some(d=>d!==null && (new Date(y,m-1,d)>=today || fixedOn[`${y}-${m}-${d}`]));
    if (alive||weeks.length) weeks.push(w);
  }

  h+=`<section><div class="slabel">予定</div>
    <div class="calhead"><button onclick="shiftMonth(-1)" aria-label="前の月">‹</button>
      <div class="m">${y}年 ${m}月</div>
      <button onclick="shiftMonth(1)" aria-label="次の月">›</button></div>
    <div class="grid gcal">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}`;
  for (const w of weeks) for (const d of w) {
    if (d===null) { h+=`<div class="cell blank"></div>`; continue; }
    const k=`${y}-${m}-${d}`, fx=fixedOn[k], cd=candOn[k];
    const past=new Date(y,m-1,d)<today;
    const cls=['cell']; let click='', inner=`<span class="d">${d}</span>`, label=`${m}月${d}日`;
    if (fx) { cls.push('fixed'); inner+=`<span class="ttl">${esc(fx.t)}</span>`;
      click=`onclick="openEvent('${fx.id}')"`; label+=` ${fx.t}`; }
    else if (past) cls.push('past');
    else {
      cls.push('addable');
      if (cd) inner+=`<span class="dot"></span>`;
      if (state.gpick.includes(k)) cls.push('sel');
      click=`onclick="togglePick('${k}')"`;
      label+=cd?` 調整中の候補日`:` 選ぶ`;
    }
    h+=`<button class="${cls.join(' ')}" ${click} ${click?'':'disabled'} aria-label="${esc(label)}">${inner}</button>`;
  }
  h+=`</div><div class="legend">
      <span><i style="background:var(--accent)"></i>決まった予定</span>
      <span><i style="background:var(--surface);position:relative"><i style="display:block;width:4px;height:4px;border-radius:50%;background:var(--muted);border:none;margin:3px auto 0"></i></i>調整中</span>
    </div>`;
  if (state.gpick.length) {
    const s=[...state.gpick].map(k=>k.split('-').map(Number)).sort((a,b)=>new Date(a[0],a[1]-1,a[2])-new Date(b[0],b[1]-1,b[2]));
    h+=`<div class="brow" style="margin-top:14px">
      <button class="b" onclick="startFromPick()" ${state.me?'':'disabled'}>この${s.length}日で決める</button>
      <span class="note">${s.map(p=>fmtS(new Date(p[0],p[1]-1,p[2]))).join('　')}</span>
      <button class="b sm quiet" onclick="state.gpick=[];render()">選び直す</button></div>`;
  }
  h+=`</section>`;

  // 進行中
  h+=`<section><div class="slabel">進行中</div>`;
  if (!live.length) {
    h+=`<p class="note">いま調整中のものはありません。</p>`;
  } else {
    h+=`<ul class="evlist">${live.map(e=>{
      const s=evStatus(e);
      const hrs=Math.max(0,Math.round(s.left/3600000));
      // 締切を過ぎたイベントは、誰かがそのページを開くまで確定処理が走らない（HANDOFF 4章）。
      // 「あと0時間」のままだと締切が壊れて見えるので、開けば決まることを直接書く。
      const left = s.left>0 ? `あと${hrs}時間` : '締切済み・開くと決まります';
      const mine = state.me ? (s.mine ? '回答済み' : '未回答') : '';
      return `<li><button class="ev ${state.me&&!s.mine?'todo':''}" onclick="openEvent('${e.id}')">
        <div class="t">${esc(e.title)}${state.me&&!s.mine?'<span class="badge">要回答</span>':''}</div>
        <div class="s">${s.best?`このままだと <b>${fmtD(s.best.c.date)}</b>　`:''}${left}　${s.done}/${s.total}人が回答${mine?'　'+mine:''}</div>
      </button></li>`;}).join('')}</ul>`;
  }
  h+=`<div class="brow" style="margin-top:14px">
    <button class="b" onclick="openNew()" ${state.me?'':'disabled title="先に名前を選んでください"'}>新しい日程</button>
    ${state.me?'':'<span class="note">先に名前を選ぶ</span>'}</div></section>`;

  // 決まったもの
  if (done.length) {
    h+=`<section><div class="slabel">決まったもの</div><ul class="evlist">${done.map(e=>{
      const c=e.candidates.find(x=>x.id===e.confirmed);
      return `<li><button class="ev ${e.confirmed?'fixed':''}" onclick="openEvent('${e.id}')">
        <div class="t">${esc(e.title)}</div>
        <div class="s">${e.confirmed&&c?`<b>${fmtD(c.date)}</b>　${esc(e.slot||'')}${e.place?'　'+esc(e.place):''}`:'決まりませんでした'}</div>
      </button></li>`;}).join('')}</ul></section>`;
  }

  // URLの共有
  h+=`<section><div class="slabel">このグループのURL</div>
    <div class="quote"><div class="txt">${esc(groupUrl())}</div>
      <div class="r"><span class="note">LINEに貼っておく</span>
        <button class="b sm line" onclick="copyText(groupInvite(),'コピーしました。')">コピー</button></div></div>
  </section>`;
  return h;
}

/* ---- ⓪ 作成画面 ---- */
function viewNew() {
  const n=state.nd, y=state.calY, m=state.calM;
  const days=new Date(y,m,0).getDate(), lead0=new Date(y,m-1,1).getDay();
  const today=new Date(); today.setHours(0,0,0,0);
  const dl=n.deadline;
  const dlv=`${dl.getFullYear()}-${pad(dl.getMonth()+1)}-${pad(dl.getDate())}T${pad(dl.getHours())}:${pad(dl.getMinutes())}`;

  let h=`<div class="hero" style="padding:26px 0 18px">
    <h1 style="font-size:23px">${state.gid?'新しい日程':'日程を決める'}</h1>
    ${state.gid?`<p style="margin-top:8px">${esc(state.gname)}　${state.gmembers.length}人</p>`:''}
  </div>
  <div class="form">
    <div class="frow"><label for="ndTitle">イベント名<span class="req">*</span></label>
      <input type="text" id="ndTitle" maxlength="40" placeholder="例）昼休み集まれる日" value="${esc(n.title)}"
        oninput="setND('title',this.value)"></div>
    ${state.gid
      ? `<div class="frow"><label>参加者</label>
          <div class="people">${state.gmembers.map(m=>`<span class="who ${m===state.me?'iam':''}">${esc(m)}</span>`).join('')}</div></div>`
      : `<div class="frow"><label for="ndHost">あなたの名前<span class="req">*</span></label>
          <input type="text" id="ndHost" maxlength="20" placeholder="けんじ" value="${esc(n.host)}"
            oninput="setND('host',this.value)"></div>`}
    <div class="frow"><label for="ndPlace">場所（任意）</label>
      <input type="text" id="ndPlace" maxlength="40" placeholder="例）学食3階 / オンライン" value="${esc(n.place)}"
        oninput="setND('place',this.value)"></div>
    <div class="frow"><label for="ndMemo">メモ（任意）</label>
      <input type="text" id="ndMemo" maxlength="80" placeholder="例）1時間くらい、進捗の共有" value="${esc(n.memo)}"
        oninput="setND('memo',this.value)"></div>

    <div class="frow"><label>時間帯</label>
      <span class="timepair">
        <input type="time" value="${esc(n.s)}" onchange="setND('s',this.value)" aria-label="開始時刻">
        <span class="note">〜</span>
        <input type="time" value="${esc(n.e)}" onchange="setND('e',this.value)" aria-label="終了時刻">
      </span>
</div>

    <div class="frow"><label>候補日<span class="req">*</span></label>
      <div class="chips">
        <button onclick="presetDays('week')">これからの平日5日</button>
        <button onclick="presetDays('next')">来週の平日5日</button>
        <button onclick="presetDays('weekend')">これからの土日4日</button>
      </div>
      <div class="calhead"><button onclick="shiftMonth(-1)" aria-label="前の月">‹</button>
        <div class="m">${y}年 ${m}月</div>
        <button onclick="shiftMonth(1)" aria-label="次の月">›</button></div>
      <div class="grid">${WD.map(w=>`<div class="wd">${w}</div>`).join('')}`;

  // 先頭と末尾を空セルで埋める。埋めないと最後の行が7列に満たず、
  // 下地（罫線の色）がそのまま見えて濃い塊になる。
  const cells=[];
  for (let i=0;i<lead0;i++) cells.push(null);
  for (let d=1;d<=days;d++) cells.push(d);
  while (cells.length%7) cells.push(null);
  // 過去しかない先頭の週は描かない（選べない日でカレンダーが伸びるのを防ぐ）
  const weeks=[];
  for (let i=0;i<cells.length;i+=7) {
    const w=cells.slice(i,i+7);
    const alive=w.some(d=>d!==null && new Date(y,m-1,d)>=today);
    if (alive||weeks.length) weeks.push(w);
  }
  for (const w of weeks) for (const d of w) {
    if (d===null) { h+=`<div class="cell blank"></div>`; continue; }
    const past=new Date(y,m-1,d)<today;
    const on=n.days.includes(`${y}-${m}-${d}`);
    const cls=['cell']; let click='';
    if (past) cls.push('past');
    else { cls.push('addable'); click=`onclick="toggleDay(${y},${m},${d})"`; }
    if (on) cls.push('pick');
    h+=`<button class="${cls.join(' ')}" ${click} ${click?'':'disabled'}
      aria-label="${m}月${d}日${on?' 選択中':''}"><span class="d">${d}</span></button>`;
  }
  const sorted=[...n.days].map(k=>k.split('-').map(Number)).sort((a,b)=>new Date(a[0],a[1]-1,a[2])-new Date(b[0],b[1]-1,b[2]));
  h+=`</div>
      <p class="picked">${sorted.length
        ? `<b>${sorted.length}日</b>　${sorted.map(p=>fmtS(new Date(p[0],p[1]-1,p[2]))).join('　')}`
        : '<span class="note">日付を押して選ぶ</span>'}</p>
    </div>

    <div class="frow"><label>回答の期日<span class="req">*</span></label>
      <div class="brow">
        <input type="date" value="${dl.getFullYear()}-${pad(dl.getMonth()+1)}-${pad(dl.getDate())}"
          onchange="setNDate(this.value)" aria-label="期日の日付">
        <input type="time" value="${pad(dl.getHours())}:${pad(dl.getMinutes())}"
          onchange="setNTime(this.value)" aria-label="期日の時刻">
      </div>
      <div class="chips" style="margin:10px 0 0">
        <button onclick="presetDeadline(24)">明日</button>
        <button onclick="presetDeadline(48)">明後日</button>
        <button onclick="presetDeadline(168)">来週</button>
      </div>
      <p class="help">この時刻を過ぎると自動で決まります。</p></div>
  </div>
  <div class="create">
    <button class="b" onclick="createFromDraft()">作る</button>
    ${n.err?`<span class="err">${esc(n.err)}</span>`:''}
  </div>`;
  return h;
}

/* ---- ④ 通知 ---- */
function viewFeed() {
  if (!state.feed.length) {
    return `<section><p class="empty">まだ通知はありません。${mode==='demo'?'<br>上の「＋1日」で時間を進めてみてください。':''}</p></section>`;
  }
  const kind={ miss:['未回答',''], fix:['確定','fix'], answer:['回答',''],
               reopen:['再調整',''], none:['不成立','fix'], cand:['候補',''], remind:['催促',''] };
  return `<section><div class="slabel">通知</div>
    <ul class="feed">${state.feed.map(f=>{
      const [k,cl]=kind[f.type]||['—',''];
      return `<li><div class="k ${cl}">${k}</div>
        <div class="bd"><div class="t">${fmt(f.at)}</div><div class="fmsg">${f.msg}</div></div></li>`;
    }).join('')}</ul></section>`;
}

// 送信していない回答を持ったまま閉じようとしたら止める
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue=''; } });
// 取り消しバーは60秒で自然に消す
setInterval(() => { if (state.undo && Date.now()-state.undo.at > 60000) { state.undo=null; renderStatus(); } }, 5000);

boot();
</script>
</body>
</html>
